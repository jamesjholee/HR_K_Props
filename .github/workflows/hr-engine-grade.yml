# .github/workflows/hr-engine-grade.yml
#
# HR Engine — evening grade
#   - 07:00 UTC (3:00am ET): all games final incl. West Coast + most extras
#   - grades YESTERDAY's slate (at 3am ET the slate date is the prior ET day)
#   - HR grade via statsapi play-by-play (grade_hrs.py) — joins on MLBAM id
#   - K finals via grade_k.py (statsapi, S/R tags)
#   - commits hrapp.db + out/grades/ -> graded ledger lands in the same
#     tamper-evident history as the morning locks (lock -> grade, auditable)
#   - workflow_dispatch for manual regrades/backfills (input a date)

name: hr-engine-grade

on:
  schedule:
    - cron: "0 7 * * *"          # 3:00am ET during DST (2:00am ET in winter — fine)
  workflow_dispatch:
    inputs:
      date:
        description: "Slate date to grade (YYYY-MM-DD, ET). Blank = yesterday ET."
        required: false

permissions:
  contents: write
  pages: write                   # deploy graded dashboard
  id-token: write                # Pages OIDC

concurrency:
  group: hr-engine               # same group as the morning run — never race the db
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests tzdata

      - name: Resolve slate date
        id: slate
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "date=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(TZ=America/New_York date -d yesterday +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Grade HRs (statsapi, id-join)
        id: hrs
        continue-on-error: true       # exit 3 = partial (games not final); still commit what we have
        run: |
          python3 grade_hrs.py --date "${{ steps.slate.outputs.date }}" | tee out_grade_hr.txt

      - name: Grade Ks
        continue-on-error: true       # keep HR grade even if K grader hiccups
        run: |
          if [ -f grade_k.py ]; then
            python3 grade_k.py "${{ steps.slate.outputs.date }}" --db hrapp.db | tee out_grade_k.txt
          else
            echo "grade_k.py not found — skipping K grade"
          fi

      - name: Save grade log
        run: |
          mkdir -p out/grades
          {
            echo "# Grade — ${{ steps.slate.outputs.date }} (run $(date -u +%FT%TZ))"
            echo; echo "## HR"; cat out_grade_hr.txt 2>/dev/null || echo "no output"
            echo; echo "## K";  cat out_grade_k.txt  2>/dev/null || echo "no output"
          } > "out/grades/grade_${{ steps.slate.outputs.date }}.md"

      - name: Grade appearances (statsapi boxscore)
        continue-on-error: true       # boxscore blip never blocks the grade commit
        run: |
          python3 appearances.py --date "${{ steps.slate.outputs.date }}" | tee out_grade_app.txt

      - name: Late-finish sweep (D-2)
        continue-on-error: true       # sweep is best-effort; idempotent writes
        run: |
          # Re-grade the day BEFORE the slate being graded: catches West Coast
          # extras that outlasted the 07:00 UTC cron and suspended games that
          # resumed and finished the next day. hr_finals is INSERT OR IGNORE
          # on a per-event key and appearances upsert, so re-running a fully
          # graded date is a no-op. track.py below re-reconciles the ledger.
          SWEEP=$(date -u -d "${{ steps.slate.outputs.date }} -1 day" +%F)
          echo "=== D-2 sweep: $SWEEP ==="
          python3 grade_hrs.py --date "$SWEEP" | tee out_sweep_hr.txt
          python3 appearances.py --date "$SWEEP" | tee out_sweep_app.txt

      - name: Season ledger (track.py)
        continue-on-error: true       # record strip is additive, never blocks the grade commit
        run: |
          python3 track.py | tail -20

      - name: Commit graded ledger
        run: |
          git config user.name  "hr-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          git add hrapp.db out/grades/ out/season_report.md out/season.json
          git diff --cached --quiet || git commit -m "grade: slate ${{ steps.slate.outputs.date }}"
          git pull --rebase origin main || true
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/               # re-serve out/ so the graded dashboard + report go live overnight

      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
