# .github/workflows/hr-engine-daily.yml
#
# HR Engine — daily automation
#   - 14:00 UTC (10am ET) scheduled morning run
#   - workflow_dispatch for near-lock reruns (fire manually after the
#     30-min starter/lineup human gate — do NOT cron this; GH schedule
#     drifts 5-15 min and the human gate must come first anyway)
#   - commits out/dashboard.html + hrapp.db back to the repo
#     -> every lock gets a GitHub-stamped, tamper-evident timestamp
#     (no-peek rule enforced by git history)
#   - deploys the dashboard to GitHub Pages

name: hr-engine-daily

on:
  schedule:
    - cron: "0 14 * * *" # 14:00 UTC = 10:00 ET (9:00 ET in winter — adjust Nov)
  workflow_dispatch: # manual rerun button (near-lock refresh)

permissions:
  contents: write # commit db + dashboard
  pages: write # deploy Pages
  id-token: write # Pages OIDC

concurrency:
  group: hr-engine # never let two runs race the db commit
  cancel-in-progress: false

jobs:
  run-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # zoneinfo needs tzdata on slim environments; harmless if present
          pip install tzdata

      - name: Compute slate date (ET)
        id: slate
        run: |
          echo "date=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"

      - name: Pull bullpen usage
        # relievers.py reads raw/bullpen_usage.json; pull it fresh each run.
        # Cache-buster param per standing rules. continue-on-error because
        # run_morning.py already degrades gracefully (PEN-EDGE blank + alert).
        continue-on-error: true
        run: |
          mkdir -p raw
          curl -sf "https://api.propfinder.app/mlb/bullpen-usage?v=$RANDOM$RANDOM" \
            -o raw/bullpen_usage.json

      - name: Write odds cookie
        run: |
          printf '%s' "${{ secrets.ODDS_COOKIE }}" > cookie.txt

      - name: Morning run
        run: |
          python3 run_morning.py --date "${{ steps.slate.outputs.date }}"

      - name: Freeze virtual cards (top-30 / top-60)
        continue-on-error: true      # card logging must never block the lock
        run: |
          python3 log_virtual_card.py --date "${{ steps.slate.outputs.date }}"

      - name: Commit locks (dashboard + db)
        run: |
          git config user.name  "hr-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          git add out/dashboard.html hrapp.db
          # commit only if something changed (rerun with identical data = no-op)
          git diff --cached --quiet || git commit -m "lock: slate ${{ steps.slate.outputs.date }} ($(date -u +%H:%MZ))"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/ # serves dashboard.html at the site root path /dashboard.html

      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
